name: Compilar mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el zip
        run: |
          mkdir proyecto
          unzip -q nucleo-arena.zip -d proyecto
          RAIZ=$(dirname "$(find proyecto -name build.gradle | head -n 1)")
          echo "RAIZ=$RAIZ" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Compilar
        working-directory: ${{ env.RAIZ }}
        run: gradle build --stacktrace

      - name: Guardar el jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nucleo-arena-jar
          path: ${{ env.RAIZ }}/build/libs/*.jar
